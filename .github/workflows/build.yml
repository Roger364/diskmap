name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    # Le binaire grave son origine a la compilation : sans ce mot, la release
    # publiee dirait « agent NON DECLARE » — un livrable qui ne sait pas qui l'a
    # construit, ce qu'on a paye une fois.
    env:
      DISKMAP_AGENT: github-actions
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Compiler
        run: cargo build --release

      - name: Qualite Rust
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Installer les sondes navigateur
        working-directory: tests/sondes
        run: |
          npm ci
          npx playwright install chromium

      # La regle « ce volume est-il jetable ? » est eprouvee AVANT toute sonde.
      # Ce test ne supprime rien : il verifie une fonction pure, les volumes
      # reellement montes, et — le point qui compte — que le harnais APPELLE
      # bien la regle. Une garde non exercee est une intention, et ce depot en a
      # deja mis au jour une : `filet.mjs` refusait par volume sans que la branche
      # ne puisse jamais s executer.
      - name: Regle du volume jetable
        working-directory: tests/sondes
        run: npm test

      # La CI doit rester sûre même sur un runner auto-hébergé : les scénarios
      # qui créent ou suppriment des fichiers ne sont lancés que manuellement,
      # sur un volume jetable explicitement configuré. Le job « sondes » plus bas
      # les exécute quand même, mais sur un runner GitHub éphémère, qui est
      # jeté après le job.
      #
      # Même délai long que ci-dessous, pour la même raison : C: est analysé
      # aussi, et sur un runner il contient l'image entière de l'agent.
      # La machine, pas le volume, est ce qui est ephemere ici. Aucun releve ne
      # peut etablir cela — le `D:` d'un runner est un disque physique comme un
      # autre — et c'est donc declare. Le mot est repris tel quel dans le log de
      # chaque run : une declaration qu'on ne voit pas est une declaration qu'on
      # n'a pas lue.
      - name: Sondes non destructives
        env:
          DISKMAP_SONDE_MACHINE_EPHEMERE: runner-github-ephemere
        run: node tests/sondes/lancer.mjs --volume D --attendre 900 --sans generation,reelle,lot,ui,csrf,erreurs

      - name: Publier le binaire
        uses: actions/upload-artifact@v7
        with:
          name: diskmap-windows
          path: target/release/diskmap.exe

  # Les sondes qui CREENT et SUPPRIMENT, y compris celle qui rejoue l'incident
  # du 26/09/2026. Elles sont écartées du job ci-dessus pour une seule raison :
  # ce job peut tourner sur un runner auto-hébergé, où « volume jetable » n'est
  # pas une garantie. Ici, `runs-on: windows-latest` est un runner ÉPHÉMÈRE — il
  # n'existe plus après le job, et son disque D: est un scratch. C'est donc le
  # seul endroit où ces sondes peuvent tourner en continu, et c'est le seul endroit
  # où la régression qu'elles couvrent serait réellement gardée : sans ce job, le
  # défaut d'identifiant-position et le filet de sécurité ne sont vérifiés que par
  # une main, un jour, sur le poste de quelqu'un.
  sondes:
    runs-on: windows-latest
    env:
      DISKMAP_AGENT: github-actions
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Compiler
        run: cargo build --release

      - name: Installer les sondes navigateur
        working-directory: tests/sondes
        run: |
          npm ci
          npx playwright install chromium

      # La regle « ce volume est-il jetable ? » est eprouvee AVANT toute sonde.
      # Ce test ne supprime rien : il verifie une fonction pure, les volumes
      # reellement montes, et — le point qui compte — que le harnais APPELLE
      # bien la regle. Une garde non exercee est une intention, et ce depot en a
      # deja mis au jour une : `filet.mjs` refusait par volume sans que la branche
      # ne puisse jamais s executer.
      - name: Regle du volume jetable
        working-directory: tests/sondes
        run: npm test

      # Le filet est le sujet de ce job autant que les sondes : c'est lui qui doit
      # empêcher qu'une sonde vise hors de sa racine, et la sortie est ROUGE si
      # une autre sonde qu'`filet` a provoqué un incident. Voir tests/sondes/filet.mjs.
      #
      # `--attendre 900` : le runner analyse D: ET C:, et C: contient toute
      # l'image de l'agent. Sur la machine de développement, C: est un disque de
      # données et s'analyse en quelques secondes ; ici, le délai par défaut
      # (180 s par volume) était dépassé. Le harness le dit maintenant « délai
      # dépassé » et non « ECHEC » : les deux n'ont pas la même cause, et
      # confondre les deux accuse l'application là où il n'y a rien.
      - name: Toutes les sondes, filet compris
        env:
          DISKMAP_SONDE_VOLUME: D
          DISKMAP_SONDE_RACINE: 'D:\_diskmap_sondes'
          DISKMAP_SONDE_MACHINE_EPHEMERE: runner-github-ephemere
        run: node tests/sondes/lancer.mjs --volume D --attendre 900

  # Le binaire telechargeable ne doit jamais avoir ete eprouve par quelqu'un
  # d'autre que celui qui le publie. Il est donc pris TEL QUEL dans l'artifact du
  # job `windows` — celui qui a passe fmt, clippy, test et les sondes non
  # destructives. Le recompiler ici republierait un autre binaire que celui qui
  # a ete verifie : c'est exactement le defaut qui rendait le 26/09/2026
  # inexpliquable, « un binaire perime que personne ne savait de quel commit il
  # sortait ». Ici, le tag nomme le commit, et le binaire est celui du commit.
  #
  # `needs: [windows, sondes]` n'est pas decoratif : si la qualite OU les sondes
  # echouent, aucune release n'est creee. Publier n'est pas une consequence du
  # push, c'est une consequence du push QUI A PASSE. Les deux jobs sont
  # bloquants, y compris celui qui supprime vraiment : un binaire publie apres
  # un echec du filet, c'est le scenario qu'on a deja paye une fois.
  release:
    needs: [windows, sondes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Recuperer le binaire eprouve
        uses: actions/download-artifact@v8
        with:
          name: diskmap-windows
          path: .

      # Le titre porte le SHA court : une release qui dit « voici le binaire »
      # sans dire de quel commit il sort ne resout pas le probleme qu'elle
      # pretend resoudre.
      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.1.${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          git log -1 --pretty=%s | Out-File -FilePath notes.md -Encoding utf8
          "Commit : $env:SHA" | Out-File -FilePath notes.md -Encoding utf8 -Append
          "" | Out-File -FilePath notes.md -Encoding utf8 -Append
          "Binaire compile et eprouve par la CI de ce commit (fmt, clippy, test, sondes)." |
            Out-File -FilePath notes.md -Encoding utf8 -Append
          gh release create $env:TAG .\diskmap.exe --title "$env:TAG ($($env:SHA.Substring(0,7)))" --notes-file notes.md

