name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Compiler
        run: cargo build --release

      - name: Qualite Rust
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Installer les sondes navigateur
        working-directory: tests/sondes
        run: |
          npm ci
          npx playwright install chromium

      # La CI doit rester sûre même sur un runner auto-hébergé : les scénarios
      # qui créent ou suppriment des fichiers ne sont lancés que manuellement,
      # sur un volume jetable explicitement configuré.
      - name: Sondes non destructives
        run: node tests/sondes/lancer.mjs --volume D --sans generation,reelle,lot,ui,csrf,erreurs

      - name: Publier le binaire
        uses: actions/upload-artifact@v7
        with:
          name: diskmap-windows
          path: target/release/diskmap.exe
